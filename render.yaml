services:
  # Node.js Backend API Service
  - type: web
    name: daam-dekho-backend
    runtime: node
    buildCommand: cd app/backend-node && npm install
    startCommand: cd app/backend-node && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"

  # Vite React Frontend Static Site
  - type: web
    name: daam-dekho-frontend
    runtime: static
    buildCommand: cd app/frontend && npm install && npm run build
    staticPublishPath: app/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: daam-dekho-backend
          property: host
